
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live AI Avatar Studio</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  background: #101322;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #a78bfa; }

.container {
  max-width: 900px;
  margin: 25px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
  gap: 20px;
}

.panel {
  background: #20263a;
  padding: 20px;
  border-radius: 15px;
}

.preview {
  height: 300px;
  background: #080b14;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  perspective: 700px;
}

#avatar {
  display: none;
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  transform-origin: center center;
  will-change: transform;
  transition: transform 0.08s linear;
}

video { display: none; }

input {
  max-width: 100%;
  margin: 15px;
}

button {
  padding: 12px 18px;
  margin: 8px;
  background: #8b5cf6;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#status {
  color: #c4b5fd;
  margin: 20px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h1>✨ Live AI Avatar Studio</h1>
<p>Upload a portrait and control its movement with your webcam.</p>

<div class="container">

  <div class="panel">
    <h2>Your Avatar</h2>

    <div class="preview">
      <img id="avatar" alt="Uploaded portrait">
      <span id="placeholder">Upload your photo here</span>
    </div>

    <input type="file" id="photo" accept="image/*">
  </div>

  <div class="panel">
    <h2>Camera Tracking</h2>
    <p>Camera runs privately in your browser.</p>
    <button id="start">Start Tracking</button>
    <button id="stop" disabled>Stop</button>
    <video id="camera" autoplay playsinline muted></video>
    <p id="status">Upload a photo to begin.</p>
  </div>

</div>

<div class="panel" style="max-width:900px;margin:auto">
  <h2>Live Movement Information</h2>
  <p id="head">Head: Waiting</p>
  <p id="mouth">Mouth: Waiting</p>
  <p id="eyes">Eyes: Waiting</p>
</div>

<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const camera = document.getElementById("camera");
const avatar = document.getElementById("avatar");
const status = document.getElementById("status");

let tracker = null;
let stream = null;
let running = false;
let previousTime = -1;

let smoothX = 0;
let smoothY = 0;
let smoothAngle = 0;

const clamp = (value, min, max) =>
  Math.max(min, Math.min(max, value));

document.getElementById("photo").addEventListener(
  "change", event => {
    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      status.textContent = "Please choose an image.";
      return;
    }

    avatar.src = URL.createObjectURL(file);
    avatar.style.display = "block";

    document.getElementById("placeholder").style.display =
      "none";

    status.textContent = "Portrait uploaded successfully!";
  }
);

async function loadTracker() {

  status.textContent = "Loading face tracking model...";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  tracker = await FaceLandmarker.createFromOptions(
    vision,
    {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "CPU"
      },

      runningMode: "VIDEO",
      numFaces: 1,
      outputFaceBlendshapes: true
    }
  );
}

async function startTracking() {

  if (!avatar.src) {
    status.textContent = "Please upload a photo first.";
    return;
  }

  try {

    document.getElementById("start").disabled = true;

    if (!tracker) {
      await loadTracker();
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: 320,
        height: 240,
        facingMode: "user"
      },
      audio: false
    });

    camera.srcObject = stream;

    await camera.play();

    running = true;
    previousTime = -1;

    document.getElementById("stop").disabled = false;

    status.textContent = "Face tracking is starting...";

    requestAnimationFrame(track);

  } catch (error) {

    status.textContent = "Camera error: " + error.message;

    document.getElementById("start").disabled = false;
  }
}

function track() {

  if (!running) return;

  if (
    camera.readyState >= 2 &&
    camera.currentTime !== previousTime
  ) {

    previousTime = camera.currentTime;

    const result = tracker.detectForVideo(
      camera,
      performance.now()
    );

    if (result.faceLandmarks.length > 0) {

      const points = result.faceLandmarks[0];

      const nose = points[1];
      const leftEye = points[33];
      const rightEye = points[263];

      const eyeAngle = Math.atan2(
        rightEye.y - leftEye.y,
        rightEye.x - leftEye.x
      );

      const eyeDistance = Math.hypot(
        rightEye.x - leftEye.x,
        rightEye.y - leftEye.y
      );

      const eyeMiddle = (leftEye.x + rightEye.x) / 2;

      const moveX = clamp(
        (0.5 - nose.x) * 180,
        -70,
        70
      );

      const moveY = clamp(
        (0.5 - nose.y) * 130,
        -45,
        45
      );

      const yaw = clamp(
        ((nose.x - eyeMiddle) /
        Math.max(eyeDistance, 0.001)) * 35,
        -20,
        20
      );

      const angle = clamp(
        eyeAngle * 180 / Math.PI,
        -25,
        25
      );

      smoothX += (moveX - smoothX) * 0.25;
      smoothY += (moveY - smoothY) * 0.25;
      smoothAngle += (angle - smoothAngle) * 0.25;

      avatar.style.transform =
        `translate3d(${smoothX}px, ${smoothY}px, 0)
         rotate(${smoothAngle}deg)
         rotateY(${yaw}deg)`;

      const blend =
        result.faceBlendshapes[0]?.categories || [];

      function score(name) {
        return blend.find(
          item => item.categoryName === name
        )?.score || 0;
      }

      const jaw = score("jawOpen");

      const blink =
        (score("eyeBlinkLeft") +
         score("eyeBlinkRight")) / 2;

      document.getElementById("head").textContent =
        "Head: Tracking active";

      document.getElementById("mouth").textContent =
        "Mouth opening: " + Math.round(jaw * 100) + "%";

      document.getElementById("eyes").textContent =
        "Eye blinking: " + Math.round(blink * 100) + "%";

      status.textContent = "Your avatar is following your movements!";

    } else {

      document.getElementById("head").textContent =
        "Head: No face detected";

      status.textContent = "Please look towards your camera.";
    }
  }

  requestAnimationFrame(track);
}

function stopTracking() {

  running = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  camera.srcObject = null;

  avatar.style.transform = "none";

  document.getElementById("start").disabled = false;
  document.getElementById("stop").disabled = true;

  status.textContent = "Tracking stopped.";
}

document.getElementById("start").addEventListener(
  "click", startTracking
);

document.getElementById("stop").addEventListener(
  "click", stopTracking
);

</script>

</body>
</html>
