
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live AI Avatar Studio</title>
  <style>
    body {
      margin: 0;
      background: #101322;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    h1 { color: #a78bfa; }
    .container {
      max-width: 850px;
      margin: 25px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 20px;
    }
    .panel {
      background: #20263a;
      padding: 20px;
      border-radius: 15px;
    }
    img, video {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 12px;
      background: #080b14;
    }
    button, input {
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
    }
    button {
      background: #8b5cf6;
      color: white;
      border: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>✨ Live AI Avatar Studio</h1>
  <p>Upload an image and preview your live camera.</p>

  <div class="container">
    <div class="panel">
      <h2>Your Avatar Photo</h2>
      <img id="avatar" alt="Uploaded avatar">
      <input type="file" id="photo" accept="image/*">
    </div>

    <div class="panel">
      <h2>Live Camera</h2>
      <video id="camera" autoplay playsinline muted></video>
      <br>
      <button id="start">Start Camera</button>
      <button id="stop">Stop Camera</button>
    </div>
  </div>

  <p id="status">Upload a photo to get started.</p>

  <script>
    const photo = document.getElementById("photo");
    const avatar = document.getElementById("avatar");
    const camera = document.getElementById("camera");
    const status = document.getElementById("status");
    let stream;

    photo.addEventListener("change", () => {
      const file = photo.files[0];
      if (file) {
        avatar.src = URL.createObjectURL(file);
        status.textContent = "Photo uploaded successfully!";
      }
    });

    document.getElementById("start").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });
        camera.srcObject = stream;
        status.textContent = "Camera is running!";
      } catch (error) {
        status.textContent = "Camera access failed. Check browser permissions.";
      }
    };

    document.getElementById("stop").onclick = () => {
      if (stream) stream.getTracks().forEach(track => track.stop());
      camera.srcObject = null;
      status.textContent = "Camera stopped.";
    };
  </script>
</body>
</html>
